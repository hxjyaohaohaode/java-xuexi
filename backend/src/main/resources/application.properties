server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
spring.application.name=typeforge
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.url=${TYPEFORGE_DB_URL:jdbc:h2:file:./.work/typeforge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${TYPEFORGE_DB_USER:sa}
spring.datasource.password=${TYPEFORGE_DB_PASSWORD:}
spring.flyway.locations=classpath:io/typeforge/operations/migrations/h2
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=5000
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${TYPEFORGE_SECURE_COOKIE:false}
server.max-http-request-header-size=16KB
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
typeforge.events.dispatch-enabled=true
typeforge.events.poll-millis=1500
typeforge.bootstrap.editor-users=${TYPEFORGE_EDITOR_USERS:}
typeforge.bootstrap.admin-users=${TYPEFORGE_ADMIN_USERS:}
typeforge.export.dispatch-enabled=true
typeforge.export.poll-millis=1000
typeforge.tutor.provider-url=${TYPEFORGE_TUTOR_PROVIDER_URL:}
typeforge.tutor.api-key=${TYPEFORGE_TUTOR_API_KEY:}
typeforge.tutor.model=${TYPEFORGE_TUTOR_MODEL:}
