server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
spring.application.name=typeforge
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.url=${TYPEFORGE_DB_URL:jdbc:h2:file:./.work/typeforge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${TYPEFORGE_DB_USER:sa}
spring.datasource.password=${TYPEFORGE_DB_PASSWORD:}
spring.flyway.locations=classpath:io/typeforge/operations/migrations/h2
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=5000
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${TYPEFORGE_SECURE_COOKIE:false}
server.max-http-request-header-size=16KB
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
typeforge.events.dispatch-enabled=true
typeforge.events.poll-millis=1500
typeforge.bootstrap.editor-users=${TYPEFORGE_EDITOR_USERS:}
typeforge.bootstrap.admin-users=${TYPEFORGE_ADMIN_USERS:}
typeforge.export.dispatch-enabled=true
typeforge.export.poll-millis=1000
typeforge.tutor.provider-url=${TYPEFORGE_TUTOR_PROVIDER_URL:}
typeforge.tutor.api-key=${TYPEFORGE_TUTOR_API_KEY:}
typeforge.tutor.model=${TYPEFORGE_TUTOR_MODEL:}
typeforge.tutor.timeout-millis=${TYPEFORGE_TUTOR_TIMEOUT_MILLIS:120000}
typeforge.tutor.max-output-tokens=${TYPEFORGE_TUTOR_MAX_OUTPUT_TOKENS:8192}
typeforge.tutor.context-window-tokens=${TYPEFORGE_TUTOR_CONTEXT_WINDOW_TOKENS:32768}
typeforge.tutor.hint-output-tokens=${TYPEFORGE_TUTOR_HINT_OUTPUT_TOKENS:768}
typeforge.tutor.plan-output-tokens=${TYPEFORGE_TUTOR_PLAN_OUTPUT_TOKENS:1536}
typeforge.tutor.explanation-output-tokens=${TYPEFORGE_TUTOR_EXPLANATION_OUTPUT_TOKENS:6144}
typeforge.tutor.review-output-tokens=${TYPEFORGE_TUTOR_REVIEW_OUTPUT_TOKENS:8192}
typeforge.tutor.workflow-structured-outputs=${TYPEFORGE_TUTOR_WORKFLOW_STRUCTURED_OUTPUTS:true}
typeforge.compiler.execution-enabled=${TYPEFORGE_EXECUTION_ENABLED:false}
typeforge.compiler.worker-token=${TYPEFORGE_COMPILER_WORKER_TOKEN:}
