name: Integrated learning workbench verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  isolated-compiler:
    name: Isolated Java and Python code worker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify broker protocol and cancellation regressions
        run: python -m unittest discover -s workers/compiler -p 'test_*.py'
      - name: Build the Java 17 and Python 3 workspace image
        run: docker build -t typeforge-compiler:jdk17 workers/compiler
      - name: Verify isolation, grading, Java and Python execution, and failure recovery
        run: python workers/compiler/verify_docker.py --image typeforge-compiler:jdk17 --report .work/compiler-docker-verification.json
      - name: Upload sanitized real-container verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-container-verification
          path: .work/compiler-docker-verification.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  contracts-and-data:
    name: Contracts and real MySQL integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify evidence guards reject stale builds and incomplete results
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify contracts, data and documentation
        run: python scripts/verify.py
      - name: Verify the published source matches its evidence snapshot
        run: python scripts/record_verification.py --check-snapshot
      - name: Verify MySQL migrations and integrity in an isolated container
        run: python scripts/verify_mysql.py
      - name: Upload SQL verification report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-schema-verification
          path: .work/mysql-verification.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  java-semantics-and-http:
    name: Java semantics, persistent HTTP and browser integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_DATABASE: typeforge_runtime
          # Bootstrap root is socket-only inside this fresh disposable container.
          # The preparation step creates a random, database-scoped application login.
          MYSQL_ROOT_HOST: localhost
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - "127.0.0.1:33060:3306"
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
          --memory=1g
          --cpus=1
          --tmpfs=/var/lib/mysql:rw,size=512m
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install published classroom schema validator
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Load classroom tools in the official DeepSeek Harness registry
        working-directory: integrations/dsh-classroom
        run: |
          npm ci
          npm test
      - name: Install the locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Record static inputs and verify the isolated MySQL schema
        run: |
          python scripts/verify.py
          python scripts/verify_mysql.py
      - name: Verify and bind the complete fresh frontend build
        run: python scripts/verify_frontend.py
      - name: Verify original peer course Java sources and their observed output
        run: python scripts/verify_course_examples.py
      - name: Verify Java semantics, transactions and package the runtime
        run: python scripts/verify_java.py
      - name: Verify HTTP linkage and restart persistence on H2 files
        run: python scripts/smoke_runtime.py --profile h2
      - name: Ensure an independent MySQL client is available
        run: |
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends mysql-client
          fi
          mysql --version
      - name: Generate and mask disposable CI credentials
        run: |
          python - <<'PY'
          import os
          import secrets
          password = secrets.token_urlsafe(32)
          print("::add-mask::" + password)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("TYPEFORGE_CI_MYSQL_PASSWORD=" + password + "\n")
          PY
      - name: Prepare the scoped MySQL runtime connection
        env:
          TYPEFORGE_CI_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          TYPEFORGE_CI_MYSQL_PORT: "33060"
        run: python scripts/prepare_ci_mysql.py
      - name: Verify HTTP linkage and restart persistence on real MySQL
        run: python scripts/smoke_runtime.py --profile mysql
      - name: Verify real MySQL transaction isolation and lock handoff
        run: python scripts/verify_transaction_isolation.py
      - name: Verify editorial transactions against real MySQL
        run: python scripts/verify_content_mysql.py
      - name: Verify account lifecycle and private assets against real MySQL
        run: python scripts/verify_private_modules_mysql.py
      - name: Verify evaluation imports TEXT and Notebook interactions against real MySQL
        run: python scripts/verify_v06_modules_mysql.py
      - name: Install Chromium for the real browser integration
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Java and Python from the packaged classroom in Chromium
        run: node frontend/tests/program-runtime.mjs
      - name: Verify the HTTP DOM journey against the packaged application
        run: python scripts/browser_runtime.py --driver dom --jar backend/target/typeforge-backend-0.6.0-SNAPSHOT.jar
      - name: Verify the real browser against the packaged application
        run: python scripts/browser_runtime.py --jar backend/target/typeforge-backend-0.6.0-SNAPSHOT.jar
      - name: Bind all observed gates to this source tree and packaged JAR
        run: |
          python scripts/record_verification.py
          python scripts/record_verification.py --check-snapshot
      - name: Package the verified application and the local classroom launcher
        uses: actions/upload-artifact@v4
        with:
          name: TypeForge-classroom
          path: |
            backend/target/typeforge-backend-0.6.0-SNAPSHOT.jar
            workers/compiler/start_workbench.py
            workers/compiler/server.py
            workers/compiler/runner.py
            workers/compiler/Dockerfile
            workers/compiler/README.md
            README.md
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized runtime and isolation reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-http-smoke-verification
          path: |
            .work/frontend-build-verification.json
            .work/java-build-verification.json
            .work/smoke-runtime-h2.json
            .work/smoke-runtime-mysql.json
            .work/mysql-isolation-verification.json
            .work/mysql-content-verification.json
            .work/mysql-account-assets-verification.json
            .work/mysql-v06-modules-verification.json
            evidence/runtime-check-results.json
            evidence/runtime-review.md
            frontend/test-results/dom-runtime-report.json
            frontend/test-results/live-dom-report.json
            frontend/test-results/program-runtime.json
            frontend/test-results/browser-runtime-report.json
            frontend/test-results/browser-report.json
            frontend/test-results/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
